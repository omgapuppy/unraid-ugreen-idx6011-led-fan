name: release
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - id: meta
        run: echo "version=$(grep -oP '<!ENTITY version "\K[^"]+' unraid-ugreen-idx6011-led-fan.plg)" >> "$GITHUB_OUTPUT"
      - id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.meta.outputs.version }}
        run: |
          if gh release view "$VER" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $VER already exists; nothing to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and test read-only fan probe
        if: steps.existing.outputs.exists != 'true'
        run: make && make test
      - id: build
        if: steps.existing.outputs.exists != 'true'
        env:
          VER: ${{ steps.meta.outputs.version }}
        run: |
          SHA=$(bash release/mkpayload.sh "$VER")
          sed -i -E "s#<SHA256>[0-9a-fA-F]+</SHA256>#<SHA256>$SHA</SHA256>#" unraid-ugreen-idx6011-led-fan.plg
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        if: steps.existing.outputs.exists != 'true'
        with:
          tag_name: ${{ steps.meta.outputs.version }}
          name: ${{ steps.meta.outputs.version }}
          prerelease: true
          generate_release_notes: true
          files: |
            release/unraid-ugreen-idx6011-led-fan-${{ steps.meta.outputs.version }}.txz
            unraid-ugreen-idx6011-led-fan.plg
